<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTC Student — Không tìm thấy trang</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: #0d1018;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    .card {
      max-width: 30rem;
      padding: 2.5rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
    }
    .code {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #6366f1, #8b5cf6 55%, #06b6d4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 { margin: 1rem 0 0.5rem; font-size: 1.25rem; }
    p { margin: 0 0 1.5rem; color: #94a3b8; font-size: 0.9375rem; line-height: 1.7; }
    a.btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6 130%);
      color: #fff;
      font-weight: 600;
      font-size: 0.9375rem;
      text-decoration: none;
    }
    a.btn:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Không tìm thấy trang</h1>
    <p>
      Đường dẫn bạn mở không tồn tại. Ứng dụng dùng định tuyến phía client, nên mọi
      trang đều nằm sau <code>#/</code> — hãy quay lại trang chủ.
    </p>
    <a class="btn" href="./">Về trang chủ</a>
  </div>
</body>
</html>
